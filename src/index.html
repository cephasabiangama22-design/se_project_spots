<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="soscial media web application where user add and remove photos"
    />
    <meta name="keywords" content="photos, photos of other users" />
    <meta name="author" content="Cephas abiangama" />
    <link rel="shortcut icon" href="favicon.ico" />

    <title>Spots Project</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/Logo.svg')%>"
          alt="spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="<%=require('./images/avatar.jpg')%>"
            alt="profile image avatar"
            class="profile__avatar"
          />
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Avaitor</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/pencil.svg')%>"
                alt="pencil icon"
                class="profile__pencil-icon"
              />Edit Profile
            </button>
          </div>

          <button type="button" class="profile__add-btn">
            <img
              src="<%=require('./images/Plus.svg')%>"
              alt="plus icon"
              class="profile__plus-icon"
            />
            <span class="profile__new-post">New Post</span>
          </button>
        </section>
        <section id="card-section" class="cards page__section">
          <ul class="cards__list">
            <template id="card-template"
              ><li class="card">
                <button class="card__delete-btn" type="button">
                  <img
                    src="<%=require('./images/State=Default-delete-btn.svg')%>"
                    alt="delete-btn-icon"
                    class="card__delete-icon"
                  />
                </button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">2026 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="./images/x-image-close-button.svg"
              alt="close-btn"
              class="modal__x-icon"
            />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button
              type="submit"
              class="modal__submit-btn modal__submit-btn_disabled"
            >
              Save
            </button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="./images/x-image-close-button.svg"
              alt="close-btn-icon"
              class="modal__x-icon"
            />
          </button>
          <h2 class="modal__title">New post</h2>

          <form class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label"
              >Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="caption-type-input" class="modal__label"
              >Caption
              <input
                id="caption-type-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="caption-type-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>

    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        >
          <img
            src="./images/Close-Icon-white.svg"
            alt="close-btn-icon"
            class="modal__x-icon"
          />
        </button>
        <img src="#" alt="" class="modal__image" />
        <p class="modal__title modal__title_preview"></p>
      </div>
    </div>
  </body>
</html>
